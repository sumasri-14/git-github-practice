
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4fa;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .container {
            background-color: white;
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2563eb;
        }

        h2 {
            color: black;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <!-- Welcome Section -->
    <div class="container">
        <h1>Welcome to My Updated Project!</h1>

        <p>Hello! I am learning HTML, Git and GitHub.</p>

        <p>This is my sample website.</p>

        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </div>

    <!-- About Me Section -->
    <div class="container">
        <h2>About Me</h2>

        <p>I am learning web development.</p>

        <p>I am practising Git and GitHub.</p>
    </div>

    <!-- Contact Me Section -->
    <div class="container">
        <h2>Contact Me</h2>

        <p>Email: myemail@example.com</p>

        <p>Thank you for visiting my website!</p>
    </div>

</body>
</html>
